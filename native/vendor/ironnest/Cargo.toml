# ironnest — Cargo workspace (virtual manifest).
# Layered architecture (see docs/00 §3):  geo ← cde ← optimizer ← ironnest ;  py → pyo3
[workspace]
resolver = "3"
members  = ["crates/geo", "crates/cde", "crates/optimizer", "crates/ironnest", "crates/py"]

[workspace.package]
version      = "0.6.2"      # bump deliberately; re-bless goldens if placement code changed
edition      = "2024"       # jagua-rs lineage; edition 2024 needs Rust ≥ 1.85
rust-version = "1.88"       # MSRV floor: i_overlay 7.x (docs/03 §3.5); jagua's cast_signed floor was 1.87
                            # (stable 1.87). We build on the pinned 1.96.0 — see rust-toolchain.toml.
license      = "MPL-2.0"    # uniform across the repo

[workspace.dependencies]
# Internal crates wired through the layered architecture (path deps).
ironnest-geo       = { path = "crates/geo" }
ironnest-cde       = { path = "crates/cde" }
ironnest-optimizer = { path = "crates/optimizer" }
ironnest           = { path = "crates/ironnest" }
# External — pinned; pure-Rust, no C / no build.rs (clean cross-platform wheels).
pyo3 = { version = "0.29", features = ["abi3-py313", "extension-module"] }

# Determinism: codegen-units=1 removes parallel-codegen nondeterminism from the shipped artifact.
# (Never build with `-C target-cpu=native` — it diverges across the Mac/Win/Linux fleet.)
[profile.release]
codegen-units = 1
lto           = "thin"

# The engine is compute-bound (tight geometry / collision-detection / separation-search loops), so an
# UNOPTIMIZED build runs ~10-12× slower on real nests — which is what made `cargo test` painfully slow
# (measured: the golden test ran golden_dump ×3 at opt-level 0 in ~633 s; at opt-level 2 it is ~51 s).
# opt-level is a code-generation choice ONLY: it never enables fast-math or changes IEEE `+ − × ÷ sqrt`
# results, so placements stay byte-identical and the goldens pass unchanged (the determinism contract
# is unaffected — that lever is codegen-units/target-cpu, pinned above for the *shipped* artifact, and
# deliberately NOT set here so dev/test incremental compiles stay fast). `[profile.test]` inherits this.
# opt-level 3 measured no faster than 2 here; the residual test time is the separation-search tail
# doing real work (docs/04), which optimization can only speed so far — the deeper lever is the engine.
[profile.dev]
opt-level = 2

# Make the determinism prime directive a build gate. clippy.toml supplies the banned lists;
# this enables the lints. Engine crates opt in with `[lints] workspace = true` (py does not,
# to avoid false positives from pyo3 macro expansion). Promoted to errors by `-D warnings`.
[workspace.lints.clippy]
disallowed_types   = "warn"
disallowed_methods = "warn"
